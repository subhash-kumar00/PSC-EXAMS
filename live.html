<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SK PSC - ലൈവ് ക്ലാസ് റൂം</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      font-family: 'Noto Sans Malayalam', 'Manrope', sans-serif;
      background-color: #000000;
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    
    @keyframes compactGlow {
      0%, 100% { box-shadow: 0 0 18px rgba(6, 182, 212, 0.55); }
      50% { box-shadow: 0 0 5px rgba(6, 182, 212, 0.2); }
    }
    .poll-float-card { animation: compactGlow 1.2s infinite ease-in-out; }
    #videoCardWrapper:fullscreen { width: 100vw; height: 100vh; background: #000; }
    #videoCardWrapper:fullscreen #liveVideoFrame { min-height: 0; flex: 1 1 auto; }
    #videoCardWrapper:fullscreen #liveVideoFrame iframe {
      width: 100% !important; height: 100% !important; border: 0;
    }
  </style>
</head>
<body class="text-slate-100 h-screen w-screen flex flex-col justify-between select-none overflow-hidden">

  <!-- 🌟 മുഴുവൻ കണ്ടെന്റും ഉൾക്കൊള്ളുന്ന ഫുൾസ്ക്രീൻ റാപ്പർ -->
  <div id="videoCardWrapper" class="relative w-full h-full flex-1 flex flex-col bg-black overflow-hidden">

    <!-- 1. മുകളിലെ നാവിഗേഷൻ ഹെഡർ (Exit & Fullscreen സഹിതം) -->
    <header class="bg-slate-900/95 backdrop-blur border-b border-slate-800 px-3 sm:px-4 py-2 flex items-center justify-between gap-2 z-40 shrink-0">
      <div class="flex items-center space-x-2 min-w-0">
        <a href="index.html" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-xs font-bold text-slate-300 transition shrink-0">‹</a>
        <div class="min-w-0">
          <h1 class="text-xs sm:text-sm font-bold text-white flex items-center space-x-1.5 truncate">
            <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping shrink-0"></span>
            <span id="liveRoomTitleDisplay" class="truncate">SK PSC ലൈവ് ക്ലാസ്</span>
          </h1>
          <p class="text-[9px] text-emerald-400 truncate font-mono" id="liveUserRoleBadge">പഠിതാവ്</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-2 shrink-0">
        <span id="liveAccessBadge" class="text-[9px] font-mono font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
          LIVE
        </span>

        <!-- ഫുൾ സ്ക്രീൻ ബട്ടൺ -->
        <button onclick="toggleVideoFullScreen()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-300 rounded-lg text-xs font-bold border border-slate-700 cursor-pointer">
          ⛶ Fullscreen
        </button>

        <!-- 🚪 ക്ലാസിൽ നിന്ന് പുറത്തിറങ്ങാനുള്ള EXIT ബട്ടൺ -->
        <button onclick="exitLiveClassRoom()" class="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-black shadow cursor-pointer flex items-center space-x-1">
          <span>🚪</span>
          <span>Exit</span>
        </button>
      </div>
    </header>

    <!-- 2. 100ms Prebuilt Room Video Container -->
    <div id="liveVideoFrame" class="w-full flex-1 bg-black relative overflow-hidden">
      <div id="videoLoadingBox" class="absolute inset-0 z-10 flex items-center justify-center text-center p-6 bg-black">
        <div>
          <div class="w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
          <p class="text-xs text-slate-300 font-bold">100ms ലൈവ് ക്ലാസിലേക്ക് കണക്റ്റ് ചെയ്യുന്നു...</p>
        </div>
      </div>
    </div>

    <!-- 3. ⚡ ഫ്ലോട്ടിംഗ് ഇൻസ്റ്റന്റ് പോൾ (ഫുൾസ്ക്രീനിലും സ്ക്രീനിന് മുകളിൽ തെളിയും) -->
    <div id="pollAreaBox" class="hidden poll-float-card absolute bottom-14 left-1/2 -translate-x-1/2 z-50 bg-slate-950/90 backdrop-blur-md border border-cyan-400 rounded-2xl px-3 py-2 shadow-2xl flex flex-col items-center space-y-1.5 w-[92%] max-w-xs">
      
      <div class="w-full flex items-center justify-between text-[10px] px-1 font-bold">
        <span class="text-cyan-300 truncate">⚡ ഉത്തരം തിരഞ്ഞെടുക്കുക:</span>
        <span id="pollTimerBadge" class="text-[10px] font-mono px-2 py-0.2 rounded bg-amber-950 text-amber-300 border border-amber-500/40">10s</span>
      </div>

      <!-- ചെറിയ A, B, C, D ബട്ടണുകൾ -->
      <div class="grid grid-cols-4 gap-1.5 w-full">
        <button type="button" onclick="submitQuickVote(0)" id="voteBtn_0" class="py-1.5 bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl text-sm font-black text-white active:scale-95 cursor-pointer flex flex-col items-center justify-center">
          <span>A</span>
          <span id="pct_0" class="hidden text-[8px] text-cyan-300 font-mono">0%</span>
        </button>
        <button type="button" onclick="submitQuickVote(1)" id="voteBtn_1" class="py-1.5 bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl text-sm font-black text-white active:scale-95 cursor-pointer flex flex-col items-center justify-center">
          <span>B</span>
          <span id="pct_1" class="hidden text-[8px] text-cyan-300 font-mono">0%</span>
        </button>
        <button type="button" onclick="submitQuickVote(2)" id="voteBtn_2" class="py-1.5 bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl text-sm font-black text-white active:scale-95 cursor-pointer flex flex-col items-center justify-center">
          <span>C</span>
          <span id="pct_2" class="hidden text-[8px] text-cyan-300 font-mono">0%</span>
        </button>
        <button type="button" onclick="submitQuickVote(3)" id="voteBtn_3" class="py-1.5 bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl text-sm font-black text-white active:scale-95 cursor-pointer flex flex-col items-center justify-center">
          <span>D</span>
          <span id="pct_3" class="hidden text-[8px] text-cyan-300 font-mono">0%</span>
        </button>
      </div>

      <div class="w-full flex items-center justify-between text-[9px] px-1 font-mono">
        <span id="pollFeedbackStatus" class="font-bold text-emerald-400"></span>
        <span id="top3WinnersText" class="text-amber-300 truncate"></span>
      </div>
    </div>

    <!-- 4. 🏆 ഫ്ലോട്ടിംഗ് റാങ്ക് ലിസ്റ്റ് പോപ്പ്-അപ്പ് -->
    <div id="livePollRankModal" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
      <div class="bg-slate-900 border-2 border-amber-500/70 rounded-2xl max-w-sm w-full p-4 shadow-2xl space-y-2.5 flex flex-col max-h-[82vh]">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <div>
            <h3 class="text-xs sm:text-sm font-black text-amber-400 flex items-center space-x-1.5">
              <span>🏆</span>
              <span>തത്സമയ പോൾ റാങ്ക് ലിസ്റ്റ്</span>
            </h3>
            <p class="text-[9px] text-slate-400">ശരിയുത്തരത്തിന് +1 പോയിന്റ് (ക്ലാസിലുള്ള മുഴുവൻ പേരും)</p>
          </div>
          <button onclick="closePollRankModal()" class="text-slate-400 hover:text-white text-sm font-bold p-1 bg-slate-800 rounded-lg w-6 h-6 flex items-center justify-center cursor-pointer">✕</button>
        </div>

        <div class="overflow-y-auto custom-scroll flex-1 pr-1">
          <table class="w-full text-left text-xs text-slate-300">
            <thead class="bg-slate-950 text-slate-400 uppercase text-[9px] border-b border-slate-800 sticky top-0">
              <tr>
                <th class="p-1.5 text-center w-12">റാങ്ക്</th>
                <th class="p-1.5">വിദ്യാർത്ഥി</th>
                <th class="p-1.5 text-center w-20">മാർക്ക്</th>
              </tr>
            </thead>
            <tbody id="livePollRankTableBody" class="divide-y divide-slate-800/60 font-mono text-[11px]">
              <tr><td colspan="3" class="p-3 text-center text-slate-500">വിവരങ്ങൾ ശേഖരിക്കുന്നു...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="pt-1.5 border-t border-slate-800 flex justify-end">
          <button onclick="closePollRankModal()" class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold rounded-lg cursor-pointer">അടയ്ക്കുക</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const FIREBASE_DB_URL = "https://sk-psc-portal-default-rtdb.asia-southeast1.firebasedatabase.app";
    const HMS_SUBDOMAIN = "maya-livestream-053";
    const HMS_STUDENT_ROOM_CODE = "ftf-buvy-fes"; 

    let currentUser = null;
    let isTeacher = false;
    let liveSessionData = null;
    let activePollObj = null;
    let activePollInterval = null;
    let autoDismissTimeout = null;
    let currentVotedOption = null;
    let liveRoomFrame = null;
    let isLeavingMeeting = false;

    function sanitizePhone(raw) {
      if (!raw) return "";
      let c = String(raw).replace(/\D/g, '');
      return c.length >= 10 ? c.slice(-10) : c;
    }

    function toggleVideoFullScreen() {
      const wrapper = document.getElementById('videoCardWrapper');
      if (!document.fullscreenElement) {
        if (wrapper.requestFullscreen) {
          wrapper.requestFullscreen().catch(() => {});
        } else if (wrapper.webkitRequestFullscreen) {
          wrapper.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function exitLiveClassRoom() {
      if (confirm("ലൈവ് ക്ലാസിൽ നിന്ന് പുറത്തിറങ്ങണമെന്നുറപ്പാണോ?")) {
        leaveMeetingToHome();
      }
    }

    function leaveMeetingToHome() {
      if (isLeavingMeeting) return;
      isLeavingMeeting = true;
      try {
        if (liveRoomFrame) {
          liveRoomFrame.src = "about:blank";
          liveRoomFrame.remove();
          liveRoomFrame = null;
        }
      } catch (e) {}
      window.location.replace("index.html");
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roleQuery = urlParams.get('role');

      if (roleQuery === 'admin') {
        let savedBroadcasterCode = localStorage.getItem('sk_hms_broadcaster_code') || '';
        let broadcasterCode = prompt("അധ്യാപകന്റെ 100ms Broadcaster Room Code നൽകുക:", savedBroadcasterCode);
        
        if (broadcasterCode && broadcasterCode.trim()) {
          broadcasterCode = broadcasterCode.trim();
          localStorage.setItem('sk_hms_broadcaster_code', broadcasterCode);
          isTeacher = true;
          window.__SKPSC_BROADCASTER_ROOM_CODE__ = broadcasterCode;
          currentUser = {
            name: "സുഭാഷ് സർ (Teacher)",
            phone: "admin_master",
            is_premium: true,
            valid_until: "2099-12-31"
          };
          const roleBadge = document.getElementById('liveUserRoleBadge');
          if (roleBadge) roleBadge.textContent = "👨‍🏫 അധ്യാപകൻ (Host)";
          document.getElementById('pollAreaBox').style.display = 'none';
        } else {
          alert("Broadcaster Room Code നൽകിയിട്ടില്ല. പോർട്ടലിലേക്ക് മടങ്ങുന്നു.");
          window.location.replace("index.html");
          return;
        }
      }

      if (!isTeacher) {
        try {
          const saved = localStorage.getItem('sk_candidate_user');
          if (saved) {
            currentUser = JSON.parse(saved);
            if (currentUser && currentUser.phone) {
              currentUser.phone = sanitizePhone(currentUser.phone);
            }
          }
        } catch (e) {}

        if (!currentUser || !currentUser.phone) {
          alert("ലൈവ് ക്ലാസിൽ പങ്കെടുക്കാൻ ദയവായി ലോഗിൻ ചെയ്യുക!");
          window.location.replace("index.html");
          return;
        }
        const roleBadge = document.getElementById('liveUserRoleBadge');
        if (roleBadge) roleBadge.textContent = currentUser.Official_Name || currentUser.name || "വിദ്യാർത്ഥി";
      }

      await verifyAccessAndStartMeeting();
      setInterval(syncRealtimePollAndRank, 2000);
    });

    // വിദ്യാർത്ഥികളെ 0 മാർക്കിൽ രജിസ്റ്റർ ചെയ്യുന്നു
    async function registerStudentInLiveLeaderboard() {
      if (isTeacher || !currentUser || !currentUser.phone) return;
      const phone = sanitizePhone(currentUser.phone);
      const studentName = currentUser.Official_Name || currentUser.name || "Student";

      try {
        const res = await fetch(`${FIREBASE_DB_URL}/live_session/pollLeaderboard/${phone}.json`);
        const existing = await res.json();

        if (!existing) {
          await fetch(`${FIREBASE_DB_URL}/live_session/pollLeaderboard/${phone}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: studentName,
              phone: phone,
              score: 0,
              attempted: 0,
              lastPollId: 0
            })
          });
        }
      } catch (e) {}
    }

    async function verifyAccessAndStartMeeting() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/live_session.json?_t=${Date.now()}`);
        if (!res.ok) throw new Error(`Firebase HTTP ${res.status}`);
        liveSessionData = await res.json() || {};

        if (liveSessionData.isLive !== true && !isTeacher) {
          alert("അധ്യാപകൻ നിലവിൽ ലൈവ് ആരംഭിച്ചിട്ടില്ല!");
          window.location.replace("index.html");
          return;
        }

        const titleDisplay = document.getElementById('liveRoomTitleDisplay');
        if (titleDisplay) titleDisplay.textContent = liveSessionData.title || "SK PSC Live Class";

        const badge = document.getElementById('liveAccessBadge');
        const isFree = (liveSessionData.access_type === 'FREE');
        if (badge) badge.textContent = isTeacher ? "👑 HOST" : (isFree ? "🟢 FREE" : "🔒 PAID");

        if (!isFree && !isTeacher) {
          const now = new Date();
          const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
          const isValid = currentUser.valid_until && (currentUser.valid_until >= today);
          if (!isValid) {
            alert("🔒 ഈ ക്ലാസ് പ്രീമിയം വിദ്യാർത്ഥികൾക്ക് മാത്രമുള്ളതാണ്!");
            window.location.replace("index.html");
            return;
          }
        }

        await registerStudentInLiveLeaderboard();
        init100msPrebuiltRoom();
      } catch (err) {
        const loading = document.getElementById('videoLoadingBox');
        if (loading) {
          loading.innerHTML = '<p class="text-sm text-rose-300 font-bold">ക്ലാസിലേക്ക് കണക്റ്റ് ചെയ്യാൻ കഴിഞ്ഞില്ല. കണക്ഷൻ പരിശോധിച്ച് വീണ്ടും ശ്രമിക്കുക.</p>';
        }
      }
    }

    function init100msPrebuiltRoom() {
      const roomCode = isTeacher
        ? window.__SKPSC_BROADCASTER_ROOM_CODE__
        : HMS_STUDENT_ROOM_CODE;

      if (!roomCode) {
        const loading = document.getElementById('videoLoadingBox');
        if (loading) loading.innerHTML = '<p class="text-sm text-amber-300 font-bold">100ms Room Code ലഭ്യമല്ല!</p>';
        return;
      }

      const userName = isTeacher
        ? "സുഭാഷ് സർ (Teacher)"
        : (currentUser.Official_Name || currentUser.name || "Student");
      const userId = isTeacher ? "skpsc_teacher" : sanitizePhone(currentUser.phone);

      const roomUrl = `https://${HMS_SUBDOMAIN}.app.100ms.live/meeting/${encodeURIComponent(roomCode)}?name=${encodeURIComponent(userName)}&userId=${encodeURIComponent(userId)}`;

      const frame = document.createElement('iframe');
      frame.title = "SK PSC 100ms Live Classroom";
      frame.src = roomUrl;
      frame.allow = "camera; microphone; fullscreen; display-capture; autoplay";
      frame.referrerPolicy = "strict-origin-when-cross-origin";
      frame.allowFullscreen = true;
      frame.style.cssText = "width:100%;height:100%;border:0;display:block;background:#000;";

      frame.addEventListener('load', () => {
        const loading = document.getElementById('videoLoadingBox');
        if (loading) loading.style.display = 'none';
      });

      document.getElementById('liveVideoFrame').appendChild(frame);
      liveRoomFrame = frame;
    }

    async function syncRealtimePollAndRank() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/live_session.json?_t=${Date.now()}`);
        const session = await res.json() || {};
        const poll = session.activePoll;
        activePollObj = poll;
        const pollBox = document.getElementById('pollAreaBox');

        if (session.showRankModal === true) {
          renderLivePollRankModal(session.pollLeaderboard || {});
          document.getElementById('livePollRankModal').classList.remove('hidden');
        } else {
          document.getElementById('livePollRankModal').classList.add('hidden');
        }

        if (isTeacher) return;

        if (!poll || !poll.startedAt) {
          pollBox.classList.add('hidden');
          currentVotedOption = null;
          if (activePollInterval) clearInterval(activePollInterval);
          return;
        }

        if (pollBox.dataset.pollStarted !== String(poll.startedAt)) {
          pollBox.dataset.pollStarted = String(poll.startedAt);
          pollBox.classList.remove('hidden');
          currentVotedOption = null;
          document.getElementById('pollFeedbackStatus').textContent = "";
          document.getElementById('top3WinnersText').textContent = "";

          [0, 1, 2, 3].forEach(idx => {
            const btn = document.getElementById(`voteBtn_${idx}`);
            btn.className = "py-1.5 bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl text-sm font-black text-white active:scale-95 cursor-pointer flex flex-col items-center justify-center";
            btn.disabled = false;
            document.getElementById(`pct_${idx}`).classList.add('hidden');
          });

          const elapsedSec = Math.floor((Date.now() - Number(poll.startedAt)) / 1000);
          let timeLeft = Math.max(0, (poll.duration || 10) - elapsedSec);

          const timerBadge = document.getElementById('pollTimerBadge');
          timerBadge.textContent = `${timeLeft}s`;

          if (activePollInterval) clearInterval(activePollInterval);
          activePollInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
              clearInterval(activePollInterval);
              timerBadge.textContent = "Over";
              showPollResults(poll);

              if (autoDismissTimeout) clearTimeout(autoDismissTimeout);
              autoDismissTimeout = setTimeout(() => {
                pollBox.classList.add('hidden');
              }, 4000);
            } else {
              timerBadge.textContent = `${timeLeft}s`;
            }
          }, 1000);
        }
      } catch (err) {}
    }

    async function submitQuickVote(optionIndex) {
      if (currentVotedOption !== null || !activePollObj) return;
      currentVotedOption = optionIndex;

      document.getElementById(`voteBtn_${optionIndex}`).className = "py-1.5 bg-cyan-600 border border-cyan-300 rounded-xl text-sm font-black text-slate-950 flex flex-col items-center justify-center shadow-lg";
      document.getElementById('pollFeedbackStatus').textContent = "✓ രേഖപ്പെടുത്തി!";

      const phone = sanitizePhone(currentUser.phone) || "stud_" + Date.now().toString().slice(-4);
      const studentName = currentUser.Official_Name || currentUser.name || "Student";
      const pollId = Number(activePollObj.startedAt);
      const isCorrect = (Number(optionIndex) === Number(activePollObj.correctAnswer));

      try {
        await fetch(`${FIREBASE_DB_URL}/live_session/activePoll/votes/${optionIndex}/${phone}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: studentName, time: Date.now() })
        });

        const lbRes = await fetch(`${FIREBASE_DB_URL}/live_session/pollLeaderboard/${phone}.json`);
        let entry = await lbRes.json() || { name: studentName, phone: phone, score: 0, attempted: 0, lastPollId: 0 };

        if (entry.lastPollId !== pollId) {
          entry.name = studentName;
          entry.attempted = (Number(entry.attempted) || 0) + 1;
          if (isCorrect) {
            entry.score = (Number(entry.score) || 0) + 1;
          }
          entry.lastPollId = pollId;

          await fetch(`${FIREBASE_DB_URL}/live_session/pollLeaderboard/${phone}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(entry)
          });
        }
      } catch (e) {}
    }

    async function showPollResults(poll) {
      [0, 1, 2, 3].forEach(idx => {
        const btn = document.getElementById(`voteBtn_${idx}`);
        btn.disabled = true;
        if (idx === Number(poll.correctAnswer)) {
          btn.className = "py-1.5 bg-emerald-600 border border-emerald-300 rounded-xl text-sm font-black text-white flex flex-col items-center justify-center shadow-lg";
        } else if (idx === currentVotedOption) {
          btn.className = "py-1.5 bg-rose-600 border border-rose-300 rounded-xl text-sm font-black text-white flex flex-col items-center justify-center";
        }
      });

      if (currentVotedOption !== null) {
        const isRight = (currentVotedOption === Number(poll.correctAnswer));
        const fb = document.getElementById('pollFeedbackStatus');
        fb.textContent = isRight ? "🎉 ശരിയുത്തരം (+1)" : "❌ തെറ്റായ ഉത്തരം (0)";
        fb.className = isRight ? "font-bold text-emerald-400" : "font-bold text-rose-400";
      }

      try {
        const vRes = await fetch(`${FIREBASE_DB_URL}/live_session/activePoll/votes.json?_t=${Date.now()}`);
        const vData = await vRes.json() || {};

        const pollStart = Number(poll.startedAt) || 0;
        const countCurrentPollVotes = (optionVotes) => Object.values(optionVotes || {})
          .filter(vote => Number(vote && vote.time) >= pollStart).length;
        const c0 = countCurrentPollVotes(vData[0]);
        const c1 = countCurrentPollVotes(vData[1]);
        const c2 = countCurrentPollVotes(vData[2]);
        const c3 = countCurrentPollVotes(vData[3]);
        const total = c0 + c1 + c2 + c3;

        if (total > 0) {
          [c0, c1, c2, c3].forEach((cnt, i) => {
            const p = Math.round((cnt / total) * 100);
            const span = document.getElementById(`pct_${i}`);
            span.textContent = `${p}%`;
            span.classList.remove('hidden');
          });
        }

        const correctVotesObj = vData[poll.correctAnswer] || {};
        const winners = Object.values(correctVotesObj)
          .filter(vote => Number(vote && vote.time) >= pollStart)
          .sort((a, b) => Number(a.time) - Number(b.time))
          .slice(0, 3);
        if (winners.length > 0) {
          const namesStr = winners.map((w, idx) => `${idx + 1}.${w.name}`).join(' ');
          document.getElementById('top3WinnersText').textContent = `⚡ ${namesStr}`;
        }
      } catch (e) {}
    }

    function renderLivePollRankModal(leaderboardObj) {
      const tbody = document.getElementById('livePollRankTableBody');
      const list = Object.values(leaderboardObj || {}).sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0));

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="p-3 text-center text-slate-500">വിദ്യാർത്ഥികൾ ആരും ചേർന്നിട്ടില്ല.</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      list.forEach((item, index) => {
        const scoreVal = Number(item.score) || 0;
        let rankBadge = `${index + 1}`;
        if (index === 0 && scoreVal > 0) rankBadge = `🥇 1`;
        else if (index === 1 && scoreVal > 0) rankBadge = `🥈 2`;
        else if (index === 2 && scoreVal > 0) rankBadge = `🥉 3`;

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-800/40 border-b border-slate-800/50";
        tr.innerHTML = `
          <td class="p-2 text-center font-bold text-amber-400">${rankBadge}</td>
          <td class="p-2 font-bold text-white truncate max-w-[150px]">${item.name || 'Student'}</td>
          <td class="p-2 text-center font-bold ${scoreVal > 0 ? 'text-emerald-400' : 'text-slate-500'}">${scoreVal} Pt</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function closePollRankModal() {
      document.getElementById('livePollRankModal').classList.add('hidden');
    }
  </script>
</body>
</html>
