<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SK PSC - ലൈവ് ക്ലാസ് റൂം</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://meet.jit.si/external_api.js"></script>

  <style>
    body { font-family: 'Noto Sans Malayalam', 'Manrope', sans-serif; background-color: #020617; }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    
    @keyframes compactGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(6, 182, 212, 0.45); }
      50% { box-shadow: 0 0 4px rgba(6, 182, 212, 0.15); }
    }
    .poll-float-card { animation: compactGlow 1.2s infinite ease-in-out; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between select-none overflow-x-hidden">

  <!-- Header -->
  <header class="bg-slate-900/95 backdrop-blur border-b border-slate-800 px-3 py-2 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center space-x-2 min-w-0">
        <a href="index.html" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-xs font-bold text-slate-300 transition shrink-0">‹</a>
        <div class="min-w-0">
          <h1 class="text-xs font-bold text-white flex items-center space-x-1.5 truncate">
            <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping shrink-0"></span>
            <span id="liveRoomTitleDisplay" class="truncate">SK PSC ലൈവ്</span>
          </h1>
          <p class="text-[9px] text-slate-400 truncate font-mono" id="liveUserRoleBadge">പഠിതാവ്</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-2 shrink-0">
        <span id="liveAccessBadge" class="text-[9px] font-mono font-bold px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
          പരിശോധിക്കുന്നു...
        </span>
        <button onclick="toggleVideoFullScreen()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-300 rounded-lg text-xs font-bold border border-slate-700 cursor-pointer">
          ⛶ വിപുലീകരിക്കുക
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="flex-1 w-full max-w-7xl mx-auto p-1.5 sm:p-3 flex flex-col relative">
    
    <!-- Video Container (ഫുൾ സ്ക്രീൻ ആയാലും ഇതിനുള്ളിൽ തന്നെ നിൽക്കും) -->
    <div id="videoCardWrapper" class="w-full bg-black border border-slate-800 rounded-2xl overflow-hidden shadow-2xl relative flex-1 min-h-[75vh] flex flex-col">
      <div id="jitsiContainer" class="w-full h-full flex-1 bg-black flex items-center justify-center">
        <div id="videoLoadingBox" class="text-center py-16 space-y-2">
          <div class="w-8 h-8 border-3 border-rose-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
          <p class="text-xs text-slate-300 font-bold">ക്ലാസിലേക്ക് കണക്റ്റ് ചെയ്യുന്നു...</p>
        </div>
      </div>

      <!-- 🌟 സ്ക്രീനിന്റെ മുകളിൽ ഓവർലാപ്പ് ആയി വരുന്ന ഒതുക്കമുള്ള പോൾ ബോക്സ് -->
      <div id="pollAreaBox" class="hidden poll-float-card absolute bottom-4 left-1/2 -translate-x-1/2 z-50 bg-slate-950/90 backdrop-blur-md border border-cyan-400/80 rounded-2xl px-3 py-2 shadow-2xl flex flex-col items-center space-y-1.5 max-w-[95%] sm:max-w-md w-full">
        
        <div class="w-full flex items-center justify-between text-[11px] px-1 font-bold">
          <span class="text-cyan-300 truncate">⚡ ശരിയുത്തരം തിരഞ്ഞെടുക്കുക:</span>
          <span id="pollTimerBadge" class="text-[10px] font-mono px-2 py-0.2 rounded bg-amber-950 text-amber-300 border border-amber-500/40">10s</span>
        </div>

        <!-- ഒതുക്കമുള്ള A, B, C, D ബട്ടണുകൾ -->
        <div class="grid grid-cols-4 gap-2 w-full">
          <button type="button" onclick="submitQuickVote(0)" id="voteBtn_0" class="py-2 bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl text-base font-black text-white active:scale-95 cursor-pointer flex flex-col items-center justify-center shadow">
            <span>A</span>
            <span id="pct_0" class="hidden text-[8px] text-cyan-300 font-mono">0%</span>
          </button>
          <button type="button" onclick="submitQuickVote(1)" id="voteBtn_1" class="py-2 bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl text-base font-black text-white active:scale-95 cursor-pointer flex flex-col items-center justify-center shadow">
            <span>B</span>
            <span id="pct_1" class="hidden text-[8px] text-cyan-300 font-mono">0%</span>
          </button>
          <button type="button" onclick="submitQuickVote(2)" id="voteBtn_2" class="py-2 bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl text-base font-black text-white active:scale-95 cursor-pointer flex flex-col items-center justify-center shadow">
            <span>C</span>
            <span id="pct_2" class="hidden text-[8px] text-cyan-300 font-mono">0%</span>
          </button>
          <button type="button" onclick="submitQuickVote(3)" id="voteBtn_3" class="py-2 bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl text-base font-black text-white active:scale-95 cursor-pointer flex flex-col items-center justify-center shadow">
            <span>D</span>
            <span id="pct_3" class="hidden text-[8px] text-cyan-300 font-mono">0%</span>
          </button>
        </div>

        <div class="w-full flex items-center justify-between text-[9px] px-1 font-mono">
          <span id="pollFeedbackStatus" class="font-bold text-emerald-400"></span>
          <span id="top3WinnersText" class="text-amber-300 truncate"></span>
        </div>
      </div>

    </div>

  </main>

  <!-- 🏆 പോൾ റാങ്ക് ലിസ്റ്റ് MODAL -->
  <div id="livePollRankModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-amber-500/60 rounded-2xl max-w-sm w-full p-4 shadow-2xl space-y-3 flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h3 class="text-xs sm:text-sm font-black text-amber-400 flex items-center space-x-1.5">
          <span>🏆</span>
          <span>പോൾ റാങ്ക് ലിസ്റ്റ്</span>
        </h3>
        <button onclick="closePollRankModal()" class="text-slate-400 hover:text-white text-base font-bold p-1 bg-slate-800 rounded-lg w-6 h-6 flex items-center justify-center cursor-pointer">✕</button>
      </div>

      <div class="overflow-y-auto custom-scroll flex-1 pr-1">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-950 text-slate-400 uppercase text-[9px] border-b border-slate-800 sticky top-0">
            <tr>
              <th class="p-1.5 text-center">#</th>
              <th class="p-1.5">വിദ്യാർത്ഥി</th>
              <th class="p-1.5 text-center">പോയിന്റ്</th>
            </tr>
          </thead>
          <tbody id="livePollRankTableBody" class="divide-y divide-slate-800/60 font-mono text-[11px]">
            <tr><td colspan="3" class="p-3 text-center text-slate-500">പോൾ വിവരങ്ങൾ ലഭ്യമല്ല.</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pt-1.5 border-t border-slate-800 flex justify-end">
        <button onclick="closePollRankModal()" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-lg cursor-pointer">അടയ്ക്കുക</button>
      </div>
    </div>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://sk-psc-portal-default-rtdb.asia-southeast1.firebasedatabase.app";
    const ADMIN_SECRET_PIN = "1234";

    let currentUser = null;
    let isTeacher = false;
    let liveSessionData = null;
    let activePollInterval = null;
    let autoDismissTimeout = null;
    let currentVotedOption = null;
    let jitsiApiInstance = null;

    function sanitizePhone(raw) {
      if (!raw) return "";
      let c = String(raw).replace(/\D/g, '');
      return c.length >= 10 ? c.slice(-10) : c;
    }

    function toggleVideoFullScreen() {
      const card = document.getElementById('videoCardWrapper');
      if (!document.fullscreenElement) {
        card.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roleQuery = urlParams.get('role');

      if (roleQuery === 'admin') {
        const pin = prompt("അധ്യാപകനായി പ്രവേശിക്കാൻ അഡ്മിൻ PIN നൽകുക:");
        if (pin === ADMIN_SECRET_PIN) {
          isTeacher = true;
          currentUser = {
            name: "സുഭാഷ് സർ (Teacher)",
            phone: "admin_master",
            is_premium: true,
            valid_until: "2099-12-31"
          };
          document.getElementById('liveUserRoleBadge').textContent = "👨‍🏫 അധ്യാപകൻ (Host)";
          document.getElementById('pollAreaBox').style.display = 'none';
        } else {
          alert("തെറ്റായ PIN! വിദ്യാർത്ഥിയായി റീഡയറക്റ്റ് ചെയ്യുന്നു.");
        }
      }

      if (!isTeacher) {
        try {
          const saved = localStorage.getItem('sk_candidate_user');
          if (saved) {
            currentUser = JSON.parse(saved);
            if (currentUser && currentUser.phone) {
              currentUser.phone = sanitizePhone(currentUser.phone);
            }
          }
        } catch (e) {}

        if (!currentUser) {
          alert("ലൈവ് ക്ലാസിൽ പങ്കെടുക്കാൻ ദയവായി ലോഗിൻ ചെയ്യുക!");
          window.location.href = "index.html";
          return;
        }
        document.getElementById('liveUserRoleBadge').textContent = currentUser.name || "വിദ്യാർത്ഥി";
      }

      await verifyAccessAndStartMeeting();
      setInterval(syncRealtimePollAndRank, 2000);
    });

    async function verifyAccessAndStartMeeting() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/live_session.json?_t=${Date.now()}`);
        liveSessionData = await res.json() || {};

        if (liveSessionData.isLive !== true && !isTeacher) {
          alert("അധ്യാപകൻ നിലവിൽ ലൈവ് ആരംഭിച്ചിട്ടില്ല!");
          window.location.href = "index.html";
          return;
        }

        document.getElementById('liveRoomTitleDisplay').textContent = liveSessionData.title || "SK PSC Live Class";

        const badge = document.getElementById('liveAccessBadge');
        const isFree = (liveSessionData.access_type === 'FREE');

        badge.textContent = isTeacher ? "👑 HOST MODE" : (isFree ? "🟢 FREE LIVE" : "🔒 PAID BATCH");
        badge.className = isTeacher 
          ? "text-[9px] font-mono font-bold px-2 py-0.5 rounded-md bg-cyan-500/20 text-cyan-300 border border-cyan-500/40"
          : (isFree ? "text-[9px] font-mono font-bold px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30" : "text-[9px] font-mono font-bold px-2 py-0.5 rounded-md bg-rose-500/20 text-rose-400 border border-rose-500/30");

        if (!isFree && !isTeacher) {
          const today = new Date().toISOString().split('T')[0];
          const isValid = currentUser.valid_until && (currentUser.valid_until >= today);
          if (!isValid) {
            alert("🔒 പ്രീമിയം വിദ്യാർത്ഥികൾക്ക് മാത്രമുള്ള ക്ലാസ്!");
            window.location.href = "index.html";
            return;
          }
        }

        initJitsiMeeting(liveSessionData.roomId || "SK_PSC_LIVE_ROOM");
      } catch (err) {}
    }

    function initJitsiMeeting(roomName) {
      const domain = "meet.jit.si";
      const studentName = isTeacher ? "സുഭാഷ് സർ (Teacher)" : (currentUser.Official_Name || currentUser.name || "Student");

      const studentToolbar = ['raisehand', 'fullscreen', 'chat'];
      const teacherToolbar = ['microphone', 'camera', 'desktop', 'fullscreen', 'tileview', 'mute-everyone', 'chat'];

      const options = {
        roomName: roomName,
        width: "100%",
        height: "100%",
        parentNode: document.querySelector('#jitsiContainer'),
        userInfo: { displayName: studentName },
        configOverwrite: {
          startWithAudioMuted: true,
          startWithVideoMuted: true,
          disableDeepLinking: true,
          prejoinPageEnabled: false,
          enableWelcomePage: false,
          enableClosePage: false,
          SHOW_PROMOTIONAL_CLOSE_PAGE: false,
          HIDE_DEEP_LINKING_LOGO: true,
          // 🌟 വലതുവശത്തെ പങ്കാളികളുടെ ബോക്സ് ഹൈഡ് ചെയ്തു സ്ക്രീൻഷെയർ വലുതാക്കാൻ:
          filmstrip: {
            enabled: isTeacher,
            disableStageFilmstrip: true
          },
          disableTileView: !isTeacher
        },
        interfaceConfigOverwrite: {
          TOOLBAR_BUTTONS: isTeacher ? teacherToolbar : studentToolbar,
          SHOW_JITSI_WATERMARK: false,
          SHOW_WATERMARK_FOR_GUESTS: false,
          SHOW_BRAND_WATERMARK: false,
          SHOW_POWERED_BY: false,
          SHOW_PROMOTIONAL_CLOSE_PAGE: false,
          DISABLE_JOIN_LEAVE_NOTIFICATIONS: true
        }
      };

      document.getElementById('videoLoadingBox').style.display = 'none';
      jitsiApiInstance = new JitsiMeetExternalAPI(domain, options);

      if (isTeacher) {
        jitsiApiInstance.addEventListener('videoConferenceJoined', () => {
          setTimeout(() => {
            try { jitsiApiInstance.executeCommand('muteEveryone', 'audio'); } catch(e) {}
          }, 3000);
        });
      } else {
        jitsiApiInstance.addEventListener('audioMuteStatusChanged', (event) => {
          if (!event.muted) {
            jitsiApiInstance.executeCommand('muteEveryone', 'audio');
          }
        });
      }
    }

    async function syncRealtimePollAndRank() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/live_session.json?_t=${Date.now()}`);
        const session = await res.json() || {};
        const poll = session.activePoll;
        const pollBox = document.getElementById('pollAreaBox');

        if (session.showRankModal === true) {
          renderLivePollRankModal(session.pollLeaderboard || {});
          document.getElementById('livePollRankModal').classList.remove('hidden');
        } else {
          document.getElementById('livePollRankModal').classList.add('hidden');
        }

        if (isTeacher) return;

        if (!poll || !poll.startedAt) {
          pollBox.classList.add('hidden');
          currentVotedOption = null;
          if (activePollInterval) clearInterval(activePollInterval);
          return;
        }

        if (pollBox.dataset.pollStarted !== String(poll.startedAt)) {
          pollBox.dataset.pollStarted = String(poll.startedAt);
          pollBox.classList.remove('hidden');
          currentVotedOption = null;
          document.getElementById('pollFeedbackStatus').textContent = "";
          document.getElementById('top3WinnersText').textContent = "";

          [0, 1, 2, 3].forEach(idx => {
            const btn = document.getElementById(`voteBtn_${idx}`);
            btn.className = "py-2 bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl text-base font-black text-white active:scale-95 cursor-pointer flex flex-col items-center justify-center shadow";
            btn.disabled = false;
            document.getElementById(`pct_${idx}`).classList.add('hidden');
          });

          const elapsedSec = Math.floor((Date.now() - Number(poll.startedAt)) / 1000);
          let timeLeft = Math.max(0, (poll.duration || 10) - elapsedSec);

          const timerBadge = document.getElementById('pollTimerBadge');
          timerBadge.textContent = `${timeLeft}s`;

          if (activePollInterval) clearInterval(activePollInterval);
          activePollInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
              clearInterval(activePollInterval);
              timerBadge.textContent = "Over";
              showPollResults(poll);

              if (autoDismissTimeout) clearTimeout(autoDismissTimeout);
              autoDismissTimeout = setTimeout(() => {
                pollBox.classList.add('hidden');
              }, 4000);
            } else {
              timerBadge.textContent = `${timeLeft}s`;
            }
          }, 1000);
        }
      } catch (err) {}
    }

    async function submitQuickVote(optionIndex) {
      if (currentVotedOption !== null) return;
      currentVotedOption = optionIndex;

      document.getElementById(`voteBtn_${optionIndex}`).className = "py-2 bg-cyan-600 border border-cyan-300 rounded-xl text-base font-black text-slate-950 flex flex-col items-center justify-center shadow-lg ring-1 ring-cyan-400";
      document.getElementById('pollFeedbackStatus').textContent = "✓ രേഖപ്പെടുത്തി!";

      const studentId = currentUser.phone || "stud_" + Date.now().toString().slice(-4);
      const studentName = currentUser.Official_Name || currentUser.name || "Student";

      await fetch(`${FIREBASE_DB_URL}/live_session/activePoll/votes/${optionIndex}/${studentId}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: studentName, time: Date.now() })
      });
    }

    async function showPollResults(poll) {
      [0, 1, 2, 3].forEach(idx => {
        const btn = document.getElementById(`voteBtn_${idx}`);
        btn.disabled = true;
        if (idx === poll.correctAnswer) {
          btn.className = "py-2 bg-emerald-600 border border-emerald-300 rounded-xl text-base font-black text-white flex flex-col items-center justify-center shadow-lg ring-1 ring-emerald-400";
        }
      });

      try {
        const vRes = await fetch(`${FIREBASE_DB_URL}/live_session/activePoll/votes.json?_t=${Date.now()}`);
        const vData = await vRes.json() || {};

        const c0 = vData[0] ? Object.keys(vData[0]).length : 0;
        const c1 = vData[1] ? Object.keys(vData[1]).length : 0;
        const c2 = vData[2] ? Object.keys(vData[2]).length : 0;
        const c3 = vData[3] ? Object.keys(vData[3]).length : 0;
        const total = c0 + c1 + c2 + c3;

        if (total > 0) {
          [c0, c1, c2, c3].forEach((cnt, i) => {
            const p = Math.round((cnt / total) * 100);
            const span = document.getElementById(`pct_${i}`);
            span.textContent = `${p}%`;
            span.classList.remove('hidden');
          });
        }

        const correctVotesObj = vData[poll.correctAnswer] || {};
        const winners = Object.values(correctVotesObj).sort((a, b) => a.time - b.time).slice(0, 3);
        if (winners.length > 0) {
          const namesStr = winners.map((w, idx) => `${idx + 1}.${w.name}`).join(' ');
          document.getElementById('top3WinnersText').textContent = `⚡ ${namesStr}`;
        }
      } catch (e) {}
    }

    function renderLivePollRankModal(leaderboardObj) {
      const tbody = document.getElementById('livePollRankTableBody');
      const list = Object.values(leaderboardObj || {}).sort((a, b) => b.score - a.score);

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="p-3 text-center text-slate-500">പോൾ പോയിന്റുകൾ ലഭ്യമല്ല.</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      list.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-800/40 border-b border-slate-800/50";
        tr.innerHTML = `
          <td class="p-2 text-center font-bold text-amber-400">${index + 1}</td>
          <td class="p-2 font-bold text-white truncate max-w-[130px]">${item.name || 'Student'}</td>
          <td class="p-2 text-center text-emerald-400 font-bold">${item.score || 0}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function closePollRankModal() {
      document.getElementById('livePollRankModal').classList.add('hidden');
    }
  </script>
</body>
</html>
